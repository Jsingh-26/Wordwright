name: Model watch

# The weekly look for new GGUF releases from the publishers we track
# (docs/MODELS.md -> Updating the catalog, docs/PLAN.md P9.5).
#
# It only ever OPENS ISSUES. It never edits models/models.json: approving a
# model needs a licence check, a real download, the evaluation run and measured
# speeds before it can become an entry.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose: GitHub's scheduler is busiest then.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional. Public repositories need no token; set it if rate limits bite.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Look for new GGUF releases
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from datetime import datetime, timedelta, timezone

          # The publishers worth watching. docs/MODELS.md asks for a
          # "watch-list of publishers" without naming them; these are the
          # organisations the current catalog draws from. Edit this list to
          # change what the job watches.
          #
          # Gated publishers are deliberately absent: a model behind a licence
          # gate cannot be downloaded without an account, so it can never be a
          # catalog entry (docs/MODELS.md).
          WATCHLIST = ["Qwen", "microsoft", "HuggingFaceTB"]

          LOOKBACK_DAYS = 30

          headers = {"User-Agent": "wordwright-model-watch"}
          if os.environ.get("HF_TOKEN"):
              headers["Authorization"] = "Bearer " + os.environ["HF_TOKEN"]


          def recent_ggufs(author):
              """The author's most recently updated GGUF models."""
              url = (
                  "https://huggingface.co/api/models"
                  f"?author={author}&filter=gguf&sort=lastModified&direction=-1&limit=20"
              )
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except Exception as error:  # one bad author must not stop the rest
                  print(f"{author}: {error}")
                  return []


          def already_known(repo_id):
              """True when the catalog mentions it, or an issue already exists."""
              if repo_id.lower() in catalog:
                  return True

              title = f"Candidate model: {repo_id}"
              found = subprocess.run(
                  ["gh", "issue", "list", "--state", "all", "--limit", "200",
                   "--search", f'"{title}" in:title', "--json", "title"],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return any(item["title"] == title for item in json.loads(found.stdout or "[]"))


          def body_for(model, repo_id, last_modified):
              return "\n".join([
                  f"A new GGUF release appeared on Hugging Face from a watched publisher: **{repo_id}**",
                  "",
                  f"- Repository: https://huggingface.co/{repo_id}",
                  f"- Last modified: {last_modified}",
                  f"- Downloads (last month): {model.get('downloads', 'unknown')}",
                  "",
                  "Found by `.github/workflows/model-watch.yml`. It has not touched the catalog.",
                  "",
                  "### Before this can become a catalog entry",
                  "- [ ] Confirm the licence is permissive and the repository is **not gated** "
                  "(no account or licence click-through).",
                  "- [ ] Confirm the publisher is official, or that a well-known GGUF publisher is the source.",
                  "- [ ] Add it to `models/models.json` as `status: candidate` and bump `catalogVersion`.",
                  "- [ ] Run the eval (`docs/EVAL.md`, `eval/README.md`) and record `evalScores`.",
                  "- [ ] Fill the real `source.url`, `sizeBytes` and `sha256` from the actual file; "
                  "the downloader refuses an empty hash.",
                  "- [ ] Replace the provisional `speed` numbers with measured ones.",
                  "- [ ] Only then set `status: approved` (P9.4).",
              ])


          catalog = open("models/models.json", encoding="utf-8").read().lower()
          cutoff = datetime.now(timezone.utc) - timedelta(days=LOOKBACK_DAYS)
          opened = 0

          for author in WATCHLIST:
              for model in recent_ggufs(author):
                  repo_id = model.get("modelId") or model.get("id") or ""
                  last_modified = model.get("lastModified") or ""

                  try:
                      stamp = datetime.fromisoformat(last_modified.replace("Z", "+00:00"))
                  except ValueError:
                      continue

                  if not repo_id or stamp < cutoff or already_known(repo_id):
                      continue

                  subprocess.run(
                      ["gh", "issue", "create",
                       "--title", f"Candidate model: {repo_id}",
                       "--body", body_for(model, repo_id, last_modified)],
                      check=True,
                  )
                  opened += 1
                  print(f"opened an issue for {repo_id}")

          print(f"done: {opened} new candidate(s)")
          PY
